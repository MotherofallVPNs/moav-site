site_name: MoaV Docs
# Overridable so the PR preview can build for its own host. The i18n language
# switcher emits site_url-absolute links on the homepage (/docs/fa/), which 404
# on any host that does not serve the docs under /docs/ -- which is exactly what
# the preview does. docs-preview.yml sets SITE_URL to the preview origin.
site_url: !ENV [SITE_URL, "https://moav.sh/docs/"]
# The default site_dir is `site/`, which in this repo is the hand-written landing
# page -- a bare `mkdocs build` cleans it away. Deploy already passes this path
# explicitly; the PR preview overrides it.
site_dir: site/docs
# Header repo link + star/fork counts point at the main MoaV project.
repo_url: https://github.com/MotherofallVPNs/MoaV
repo_name: MotherofallVPNs/MoaV
# "Edit this page" still targets this repo, where the docs source lives.
edit_uri_template: https://github.com/MotherofallVPNs/moav-site/edit/main/docs/{path}

theme:
  name: material
  # overrides/ adds the .moav-blog body class on blog pages (so blog.css can adopt
  # the marketing palette) and loads the site's Inter + JetBrains Mono webfonts.
  custom_dir: overrides
  # The header keeps the cyan primary in both colour schemes, so one white
  # silhouette of the MoaV mark is correct for light and dark alike.
  logo: assets/moav-logo-white.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    # navigation.instant is deliberately absent: it breaks the i18n language
    # switcher's contextual link, so switching language would dump the reader on
    # the homepage instead of the same page translated.
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Blog:
    - blog/index.md
  - About:
    - Architecture: architecture.md
    - Mission: mission.md
    - Impact: impact.md
    - Threat Model: threat-model.md
    - Supported Protocols: protocols.md
    - Philosophy: philosophy.md
  - Getting Started:
    - Setup Guide: SETUP.md
    - DNS Configuration: DNS.md
    - VPS Deployment: DEPLOY.md
    - Run MoaV with an AI agent: ai-agent.md
  - User Guides:
    - Video Tutorials: video-tutorials.md
    - Client Apps: CLIENTS.md
    - MoaV Client: client.md
    - The moav:// Bundle: moav-bundle.md
    - MahsaNG Import: mahsanet.md
    - CLI Reference: CLI.md
    - Monitoring: MONITORING.md
    - Troubleshooting: TROUBLESHOOTING.md
  - Security:
    - OPSEC Guide: OPSEC.md
    - The Decoy Website: decoy.md
  - Support MoaV: support.md

  - Developer:
    - Development & Testing: development.md
    - Translating the Docs: TRANSLATING.md

# Blog posts are reached from the card index, not the sidebar nav, so keep them
# out of the nav tree without tripping the --strict "not in nav" check.
not_in_nav: |
  blog/posts/*
  blog/how-to-test.md

# Fail loudly on links that point at a heading which no longer exists. The DNS
# rewrite silently broke 9 inbound anchors (other pages linked to headings that
# had been renamed or folded into tabs) and a normal build said nothing.
plugins:
  # Listing `search` explicitly is required: declaring any plugin replaces the
  # theme's default plugin list, so omitting it silently kills site search.
  - search
  # NOTE: the blog is hand-built (docs/blog/index.md is a card index, posts are
  # normal pages under docs/blog/posts/), NOT Material's blog plugin. That plugin's
  # generated post pages don't survive mkdocs-static-i18n 1.3.1 (its
  # reconfigure_material_blog is an incomplete workaround, squidfunk/mkdocs-material
  # #5909), so posts silently vanish. Plain pages localize cleanly and keep the
  # full marketing design + scroll motion (stylesheets/blog.css + blog-anim.js,
  # scoped to the .moav-blog flag overrides/main.html sets on blog pages). Trade-off
  # vs the plugin: the index is curated by hand and there is no RSS yet.
  # Translations live in docs/<lang>/ mirroring the English tree. A page with no
  # translation falls back to English, so a language can ship one page at a time
  # instead of needing all of them before it is useful.
  # Contributor guide: docs/TRANSLATING.md
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fa
          name: فارسی
          build: true
          # RTL comes from reconfigure_material setting theme.language: fa --
          # Material derives dir="rtl" from the locale itself. An explicit
          # theme.direction override is rejected by the plugin.
          nav_translations:
            Home: خانه
            Quick Start: شروع سریع
            Video Tutorials: آموزش‌های ویدیویی
            Supported Protocols: پروتکل‌های پشتیبانی‌شده
        - locale: ru
          name: Русский
          build: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/blog.css

extra_javascript:
  - javascripts/blog-anim.js

validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
