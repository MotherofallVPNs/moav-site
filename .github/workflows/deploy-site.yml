name: Deploy Site & Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Fired by MotherofallVPNs/moav's release workflow on a new (non-prerelease)
  # tag, so moav.sh/install.sh and llms.txt go live within minutes of a release
  # instead of waiting for a manual site deploy. See the moav repo's release.yml.
  repository_dispatch:
    types: [moav-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build docs
        # requirements.txt, not an inline install: the PR preview builds from the
        # same file, so a plugin can't be present in one build and missing here.
        run: |
          pip install -r requirements.txt
          mkdocs build -d site/docs

      - name: Generate llms-full.txt
        # site/llms.txt is the hand-maintained index; llms-full.txt is the whole
        # docs corpus in one file, generated here so it can never drift from
        # docs/. Not committed, same as the mkdocs output under site/docs.
        run: ./scripts/build-llms-full.sh

      - name: Assert llms-full.txt has no relative links
        # Relative [CLI](CLI.md) survives into llms-full.txt and 404s there:
        # the file is served from the site root, not from /docs/.
        run: bash tests/llms-full-links-test.sh

      - name: Refresh donation addresses from FUNDING.yml
        # Addresses live in MoaV's .github/FUNDING.yml, which is already the
        # canonical list. Regenerating the table here means adding an address in
        # one repo publishes it everywhere, and the site cannot drift. Best
        # effort: on any failure the committed table stays, because a blank or
        # wrong donation address is the worst possible outcome.
        run: ./scripts/build-funding.sh

      - name: Publish latest install.sh
        # install.sh is server code — its source of truth lives in
        # MotherofallVPNs/moav. We serve it from moav.sh (reachable in censored
        # networks) instead of redirecting users to a GitHub host. Best-effort:
        # pull the latest release asset; if none exists yet, keep the copy
        # committed here so the site never serves a 404.
        run: |
          URL="https://github.com/MotherofallVPNs/moav/releases/latest/download/install.sh"
          if curl -fsSL "$URL" -o site/install.sh.new && [ -s site/install.sh.new ]; then
            mv site/install.sh.new site/install.sh
            echo "Published install.sh from the latest release asset."
          else
            rm -f site/install.sh.new
            echo "No release asset yet — keeping the committed fallback site/install.sh."
          fi

      - name: Publish latest client-install.sh
        # Same pattern as install.sh, but for the standalone client. Source of
        # truth lives in MotherofallVPNs/moav-client, published as the
        # `client-install.sh` release asset. Best-effort: pull the latest asset;
        # if none exists yet, keep the committed fallback so we never 404.
        run: |
          URL="https://github.com/MotherofallVPNs/moav-client/releases/latest/download/client-install.sh"
          if curl -fsSL "$URL" -o site/client-install.sh.new && [ -s site/client-install.sh.new ]; then
            mv site/client-install.sh.new site/client-install.sh
            echo "Published client-install.sh from the latest release asset."
          else
            rm -f site/client-install.sh.new
            echo "No release asset yet — keeping the committed fallback site/client-install.sh."
          fi

      - name: Publish latest llms.txt
        # llms.txt (the concise AI index) is authored in MotherofallVPNs/moav and
        # published as a release asset, same as install.sh — so the copy served at
        # moav.sh/llms.txt tracks the release instead of drifting. Best-effort:
        # if the release has no llms.txt asset yet (pre-first-upload), keep the
        # hand-maintained fallback committed here. llms-full.txt is still
        # generated from the docs in the step above and is unaffected.
        run: |
          URL="https://github.com/MotherofallVPNs/moav/releases/latest/download/llms.txt"
          if curl -fsSL "$URL" -o site/llms.txt.new && [ -s site/llms.txt.new ]; then
            mv site/llms.txt.new site/llms.txt
            echo "Published llms.txt from the latest release asset."
          else
            rm -f site/llms.txt.new
            echo "No llms.txt release asset yet — keeping the committed fallback site/llms.txt."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
