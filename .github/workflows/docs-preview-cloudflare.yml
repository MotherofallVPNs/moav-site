name: Docs Preview (Cloudflare)

# Gives every docs PR a real, shareable preview URL.
#
# Why not GitHub Pages: this repo's Pages source is "GitHub Actions", which
# allows exactly one live deployment (the production site). Per-PR previews on
# the same domain would mean changing how the production docs deploy, which is
# not worth the risk. Cloudflare Pages hosts previews alongside, for free.
#
# One-time setup (nothing works until this is done — the job skips cleanly):
#   1. Cloudflare dashboard → Workers & Pages → Create → Pages → "Direct Upload",
#      project name: moav-docs-preview
#   2. Create an API token with the "Cloudflare Pages: Edit" template
#   3. Add repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# The production site is untouched by this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Are the Cloudflare secrets configured?
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping the hosted preview. The Docs Preview job still attaches the built site as an artifact."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.x'

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: |
          pip install --quiet mkdocs-material
          mkdocs build --site-dir _preview

      - name: Deploy preview
        if: steps.gate.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _preview
            --project-name=moav-docs-preview
            --branch=pr-${{ github.event.pull_request.number }}

      # Update one comment rather than adding a new one per push.
      - name: Comment the preview URL
        if: steps.gate.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            📄 **Docs preview:** ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            This link is stable for the life of this PR and serves the newest build,
            so it updates on every push. (This exact commit is also pinned at
            ${{ steps.deploy.outputs.deployment-url }} if you need to compare.)

            Rendered with the real mkdocs-material build. Reviewing these pages in
            GitHub's file view will misrepresent tabs and collapsibles — they need
            the built site.

  # Previews are not free forever: Cloudflare keeps every deployment (and its
  # branch alias) until something deletes it, so a merged PR would otherwise
  # leave a live, unlisted copy of the docs at pr-N.*.pages.dev indefinitely.
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Are the Cloudflare secrets configured?
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete this PR's preview deployments
        if: steps.gate.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/moav-docs-preview/deployments"

          # jq, not inline python: an unindented heredoc inside a YAML block
          # scalar terminates the block and makes the whole workflow unparseable.
          ids=""
          page=1
          while :; do
            if ! body=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$API?env=preview&per_page=100&page=$page"); then
              echo "::warning::could not list deployments (page $page)"
              break
            fi
            batch=$(printf '%s' "$body" | jq -r --arg br "$BRANCH" '.result[]? | select(.deployment_trigger.metadata.branch == $br) | .id')
            if [ -n "$batch" ]; then
              ids="$ids $batch"
            fi
            count=$(printf '%s' "$body" | jq '(.result // []) | length')
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
            if [ "$page" -gt 20 ]; then
              echo "::warning::stopped paginating at page 20"
              break
            fi
          done

          ids=$(printf '%s' "$ids" | tr ' ' '\n' | grep -v '^$' || true)
          if [ -z "$ids" ]; then
            echo "No preview deployments found for $BRANCH - nothing to clean up."
            exit 0
          fi

          # force=true is required to delete the deployment currently serving
          # the alias, which is exactly the one we want gone.
          n=0
          for id in $ids; do
            if curl -fsS -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$API/$id?force=true" >/dev/null; then
              n=$((n + 1))
            else
              echo "::warning::could not delete deployment $id"
            fi
          done
          echo "Deleted $n preview deployment(s) for $BRANCH."

      - name: Note it on the PR
        if: steps.gate.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            📄 Docs preview for this PR has been removed now that it is closed.
