name: Docs Preview (Cloudflare)

# Gives every docs PR a real, shareable preview URL.
#
# Why not GitHub Pages: this repo's Pages source is "GitHub Actions", which
# allows exactly one live deployment (the production site). Per-PR previews on
# the same domain would mean changing how the production docs deploy, which is
# not worth the risk. Cloudflare Pages hosts previews alongside, for free.
#
# One-time setup (nothing works until this is done — the job skips cleanly):
#   1. Cloudflare dashboard → Workers & Pages → Create → Pages → "Direct Upload",
#      project name: moav-docs-preview
#   2. Create an API token with the "Cloudflare Pages: Edit" template
#   3. Add repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# The production site is untouched by this workflow.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Are the Cloudflare secrets configured?
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping the hosted preview. The Docs Preview job still attaches the built site as an artifact."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.x'

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: |
          pip install --quiet mkdocs-material
          mkdocs build --site-dir _preview

      - name: Deploy preview
        if: steps.gate.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _preview
            --project-name=moav-docs-preview
            --branch=pr-${{ github.event.pull_request.number }}

      # Update one comment rather than adding a new one per push.
      - name: Comment the preview URL
        if: steps.gate.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            📄 **Docs preview:** ${{ steps.deploy.outputs.deployment-url }}

            Rendered with the real mkdocs-material build. Reviewing these pages in
            GitHub's file view will misrepresent tabs and collapsibles — they need
            the built site.
