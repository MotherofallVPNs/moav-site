name: Claude Issue Triage

# Automated issue triage by Claude Code. Reads a new or existing issue, applies
# labels from the repo's EXISTING label set, and posts one concise triage
# comment. Triage-only: it never edits content, opens a PR, commits, or closes
# issues. Custom prompt driving the `gh` CLI, following TRIAGE.md.
#
# ── Trigger model (start = admin-only) ──────────────────────────────────────
# Runs only when a maintainer asks: a `@claude triage` comment on an issue, or a
# manual run. `author_association` keeps the comment path org-only. To auto-
# triage every new issue, uncomment the `issues` trigger below.
#
# ── Prerequisite ────────────────────────────────────────────────────────────
# The same `CLAUDE_CODE_OAUTH_TOKEN` secret as the review workflow, and the
# Claude GitHub App approved on the repo (it carries `issues: write`).

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to triage"
        required: true
        type: string
  # ── TWEAK: uncomment to auto-triage new issues ──
  # issues:
  #   types: [opened, reopened]

concurrency:
  group: claude-triage-${{ github.event.issue.number || github.event.inputs.issue }}
  cancel-in-progress: true

jobs:
  triage:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@claude triage') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve issue number
        id: issue
        run: echo "number=${{ github.event.issue.number || github.event.inputs.issue }}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Triage GitHub issue #${{ steps.issue.outputs.number }} in ${{ github.repository }} (the MoaV documentation site).
            First read TRIAGE.md (the rubric, including the security rules).

            Steps:
            1. Read the issue: `gh issue view ${{ steps.issue.outputs.number }}`.
            2. List existing labels: `gh label list`. Apply ONLY labels that already
               exist — never invent one. Add labels with
               `gh issue edit ${{ steps.issue.outputs.number }} --add-label "<label>"`. Use 1–3 at most.
            3. Post ONE concise triage comment with
               `gh issue comment ${{ steps.issue.outputs.number }} --body "..."`: restate the ask in a
               line, name the likely area (English docs `docs/*.md` / Farsi docs
               `docs/fa/*.md` / landing page `site/` / mkdocs config), say what is
               still needed, and ask up to 2–3 clarifying questions if useful.

            Hard limits (see TRIAGE.md): triage only — no content changes, no PRs, no
            commits, do not close the issue. If the issue contains a secret, a real
            server IP/domain, or a full share-URI, do NOT repeat it back; flag it and
            ask the reporter to redact. Don't re-triage an issue you've already
            commented on.
          claude_args: '--max-turns 6 --allowedTools "Read,Bash(gh issue view:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"'
