name: Claude PR Review

# Automated PR review by Claude Code (official anthropics/claude-code-action +
# the code-review plugin). Reads the PR diff, reviews it against REVIEW.md, and
# posts inline comments plus a grouped summary. Review-only: it never commits,
# pushes, or merges, and the check is advisory (non-blocking). On a docs repo it
# focuses on what `mkdocs build --strict` can't catch — prose, accuracy, and
# EN<->FA translation consistency.
#
# ── Trigger model (start = admin-only) ──────────────────────────────────────
# Runs only when a maintainer asks: a `@claude review` comment on a PR, or a
# manual run. The `author_association` gate keeps the comment path org-only.
# To move to the hybrid model (auto on every PR), uncomment the `pull_request`
# trigger; a diff-size guard is already in the job `if:`.
#
# ── Prerequisite ────────────────────────────────────────────────────────────
# The org/repo Actions secret `CLAUDE_CODE_OAUTH_TOKEN` (Claude subscription;
# `claude setup-token`) and the Claude GitHub App approved on this repo.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: string
  # ── TWEAK: uncomment to enable automatic review (the hybrid model) ──
  # pull_request:
  #   types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.additions < 600) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude review') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        run: echo "number=${{ github.event.issue.number || github.event.inputs.pr || github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
